name: Build & Package

on:
  push:
    branches: [stage]
    tags: ['v[0-9]*']
    paths:
      - 'src/**'
      - 'composer.json'
      - 'scripts/package.py'
      - '.config/shopware-extension.yml'
      - '.github/workflows/build-package.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'scripts/package.py'
      - '.config/shopware-extension.yml'
      - '.github/workflows/build-package.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Retain a versioned package as an Actions artifact (no publication)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DO_NOT_TRACK: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: shopware/shopware-cli-action@v3
        with:
          version: '0.19.5'
      - name: Validate Composer and PHP syntax
        run: |
          composer validate --no-check-publish
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build fresh assets and inspect installable ZIP
        run: python scripts/package.py
      - name: Retain explicitly requested package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.package)
        uses: actions/upload-artifact@v4
        with:
          name: AiCommerceAssistant-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
